run:
  run_name: solution-job-array-balanced
  output_dir: ../../outputs
  seed: 9001

data:
  input_jsonl: ../../examples/bottlenecks/data/balanced_requests.jsonl
  id_key: id
  text_key: text
  work_units_key: work_units
  max_records: 0

inference:
  batch_size: 4
  input_dim: 1024
  compute_repeats: 4
  work_unit_sleep_seconds: 0.020

runtime:
  require_gpu: true
  allow_cpu_fallback: false

output:
  raw_dir: raw
  run_summary_json: run_summary.json

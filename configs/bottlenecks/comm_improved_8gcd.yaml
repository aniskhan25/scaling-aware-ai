run:
  run_name: solution-comm-8gcd
  output_dir: ../../outputs

workload:
  samples_per_step: 128
  steps: 40
  warmup_steps: 5
  hidden_size: 2048
  compute_repeats: 6
  all_reduce_repeats: 1
  all_reduce_elements: 2048

runtime:
  require_gpu: true
  allow_cpu_fallback: false

output:
  raw_dir: raw
  metrics_prefix: metrics_rank
  run_summary_json: run_summary.json
